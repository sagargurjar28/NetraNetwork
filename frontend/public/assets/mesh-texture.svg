    <path d="M0 60 H420 M0 120 H420 M0 180 H420 M0 240 H420 M0 300 H420 M0 360 H420"/>
    <path d="M60 0 V420 M120 0 V420 M180 0 V420 M240 0 V420 M300 0 V420 M360 0 V420"/>
